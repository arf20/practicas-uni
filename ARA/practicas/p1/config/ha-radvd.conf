interface eth0 {
        AdvSendAdvert on;
        MaxRtrAdvInterval 3;
        MinRtrAdvInterval 1;
        AdvIntervalOpt on;
        AdvHomeAgentFlag on;
        AdvHomeAgentInfo on;
        HomeAgentLifetime 1800;
        HomeAgentPreference 10;
 
        # Home agent address
        prefix 3f32::/64 {
                AdvRouterAddr on;
                AdvOnLink on;
                AdvAutonomous on;
        };
};

